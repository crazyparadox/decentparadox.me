<img class="bat" src="sleeping.png" alt="">
<span class="z" data-i="0">z</span><span class="z" data-i="1">z</span><span class="z" data-i="2">z</span>
<script>
  const f = parseFloat(new URLSearchParams(location.search).get('f') || '0.62')
  // breathing: one slow rise and fall per loop
  const breath = (1 - Math.cos(f * Math.PI * 2)) / 2
  document.querySelector('.bat').style.transform = `scale(${1 + breath * 0.012}, ${1 + breath * 0.02})`
  // three z's leave his head one after another, drift up and to the right, grow and fade
  document.querySelectorAll('.z').forEach((el) => {
    const t = (f + 1 - el.dataset.i / 3) % 1
    el.style.left = `${884 + t * 96 + Math.sin(t * 6.283) * 8}px`
    el.style.top = `${236 - t * 176}px`
    el.style.fontSize = `${34 + t * 54}px`
    el.style.opacity = Math.max(0, Math.min(1, t * 6, (1 - t) * 2.2)).toFixed(3)
    el.style.transform = `rotate(${-8 + t * 16}deg)`
  })
</script>
